server {
    listen 80;
    server_name wqm.hydroclimatex.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://wqm.hydroclimatex.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name wqm.hydroclimatex.com;
    root /usr/share/nginx/tools/wqm;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wqm.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wqm.hydroclimatex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /health { access_log off; return 200 "healthy\n"; }
    location = /style.css { alias /usr/share/nginx/tools/style.css; }
    location = /vendor/plotly-2.35.2.min.js { alias /usr/share/nginx/html/vendor/plotly-2.35.2.min.js; }
    location / { try_files $uri $uri/ /index.html; }
}

