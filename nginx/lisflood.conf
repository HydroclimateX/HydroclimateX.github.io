upstream lisflood_backend {
    server lisflood-runner:8080;
}

limit_req_zone $binary_remote_addr zone=lisflood_submit:10m rate=2r/m;

server {
    listen 80;
    server_name lisflood.hydroclimatex.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://lisflood.hydroclimatex.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name lisflood.hydroclimatex.com;
    root /usr/share/nginx/lisflood;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/lisflood.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lisflood.hydroclimatex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /health { access_log off; return 200 "healthy\n"; }
    location = /results/manifest.json {
        alias /srv/lisflood-results/manifest.json;
        add_header Cache-Control "no-store" always;
    }
    location /results/ {
        alias /srv/lisflood-results/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /api/lisflood/run {
        limit_req zone=lisflood_submit burst=1 nodelay;
        proxy_pass http://lisflood_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /api/lisflood/ {
        proxy_pass http://lisflood_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
