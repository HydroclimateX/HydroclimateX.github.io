# TLS static application server and API reverse proxy for WASP-Web.\n\n# Deliberately excludes client address, user agent, referrer and query string.\nlog_format privacy_safe '$time_iso8601 status=$status route=$uri method=$request_method duration=$request_time';\naccess_log /var/log/nginx/access.log privacy_safe;

upstream wasp_backend {
    server wasp-api:8000;
}

limit_req_zone $binary_remote_addr zone=wasp_predict_rate:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=wasp_predict_conn:10m;
limit_conn_zone $server_name zone=wasp_predict_global:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name wasp.hydroclimatex.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://wasp.hydroclimatex.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/wasp.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasp.hydroclimatex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    server_name wasp.hydroclimatex.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wasp.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasp.hydroclimatex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow multipart framing overhead; FastAPI still enforces a 10 MB file.
    client_max_body_size 11M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Keep the /api prefix when forwarding to FastAPI.
    location /api/ {
        proxy_pass http://wasp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long-running WASP computations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Predictions are CPU intensive: bound request bursts and per-client concurrency.
    location = /api/wasp/predict {
        limit_req zone=wasp_predict_rate burst=2 nodelay;
        limit_conn wasp_predict_conn 1;
        limit_conn wasp_predict_global 1;

        proxy_pass http://wasp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Serve the dedicated WASP application; unknown client-side routes return it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
