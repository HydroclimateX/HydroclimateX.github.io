# TLS reverse proxy for WASP-Web. FastAPI owns all CORS handling.

upstream wasp_backend {
    server wasp-api:8000;
}

server {
    listen 80;
    server_name wasp.hydroclimatex.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wasp.hydroclimatex.com;

    ssl_certificate /etc/letsencrypt/live/wasp.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasp.hydroclimatex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Max upload size (10 MB CSV files)
    client_max_body_size 10M;

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Proxy to FastAPI
    location / {
        proxy_pass http://wasp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long-running WASP computations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

    }

    # Static files — cache aggressively
    location /static/ {
        proxy_pass http://wasp_backend/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
