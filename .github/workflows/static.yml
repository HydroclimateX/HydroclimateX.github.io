name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekly Google Scholar refresh on Monday (GitHub Pages stays static between refreshes).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # to commit refreshed Scholar data back to main
  pages: write
  id-token: write

# Allow only one concurrent deployment; let in-progress production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Refresh Scholar data (schedule / manual only) --------------------
      - name: Refresh public Google Scholar profile and publications
        id: scholar_refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 scripts/sync_scholar.py --write --retries 3

      - name: Keep last verified Scholar data when refresh is unavailable
        if: steps.scholar_refresh.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar declined the scheduled refresh. The site will keep the last verified data and still deploy."

      - name: Commit refreshed Scholar data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data/scholar-stats.json data/scholar-publications.json; then
            echo "No Scholar changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar-stats.json data/scholar-publications.json
            git commit -m "chore: refresh Google Scholar profile"
            git push
          fi

      # --- Build the published artifact (web root only) ----------------------
      - name: Stage web-root files for Pages
        run: |
          mkdir -p _site
          cp index.html main.js style.css _site/
          cp -r showcase data figs _site/
          if [ -d assets ]; then
            cp -r assets _site/
          fi
          test -f _site/index.html
          test -f _site/showcase/wasp-web/index.html
          test -f "_site/figs/Flood&Drought.jpeg"
          # The interactive application is deployed only to wasp.hydroclimatex.com.
          test ! -e _site/wasp-app

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
