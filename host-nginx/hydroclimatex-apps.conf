# Public HTTP entry point for the six HydroclimateX applications. ACME stays
# inside the Docker proxy; all other clear-text requests redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name wasp.hydroclimatex.com lisflood.hydroclimatex.com analytics.hydroclimatex.com telemetry.hydroclimatex.com wqm.hydroclimatex.com synthesis.hydroclimatex.com;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wasp.hydroclimatex.com;
    ssl_certificate /opt/hydroclimatex-wasp/state/conf/live/wasp.hydroclimatex.com/fullchain.pem;
    ssl_certificate_key /opt/hydroclimatex-wasp/state/conf/live/wasp.hydroclimatex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/hydroclimatex-docker-proxy.conf;
}

