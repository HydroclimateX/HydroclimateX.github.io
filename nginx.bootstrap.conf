# HTTP-only configuration used only while Certbot obtains the first certificate.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name wasp.hydroclimatex.com analytics.hydroclimatex.com telemetry.hydroclimatex.com;
    client_max_body_size 11M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
