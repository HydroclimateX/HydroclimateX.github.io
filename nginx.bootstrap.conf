# HTTP-only configuration used only while Certbot obtains the first certificate.
server {
    listen 80;
    server_name wasp.hydroclimatex.com;
    client_max_body_size 10M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
